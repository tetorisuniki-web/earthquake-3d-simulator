<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D地震被害シミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#fff;font-family:system-ui,sans-serif}header{padding:12px;font-weight:bold;font-size:18px}#view{height:52vh;min-height:290px}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{padding:12px;display:grid;gap:12px}.card{background:#202c3b;border-radius:12px;padding:12px}label{display:flex;justify-content:space-between;margin:8px 0}input,button{font:inherit}input{width:100%}.buttons{display:flex;gap:8px}button{flex:1;border:0;border-radius:8px;padding:11px 3px;background:#1687dc;color:white;font-weight:bold}.secondary{background:#435266}small{color:#bdcbd9;line-height:1.5}#status{color:#80d8ff}
</style></head><body>
<header>🏠 3D 地震被害シミュレーター</header><div id="view"></div><div class="panel">
<div class="card"><label>設定震度 <b id="iv">6強</b></label><input id="intensity" type="range" min="1" max="9" step="1" value="8"><small>1〜4、5弱、5強、6弱、6強、7。被害表現は簡易モデルです。</small><label>継続時間 <b id="dv">20 秒</b></label><input id="duration" type="range" min="5" max="60" step="5" value="20"></div>
<div class="card"><div class="buttons"><button id="start">▶ 地震発生</button><button id="pause" class="secondary">Ⅱ 一時停止</button><button id="reset" class="secondary">↻ リセット</button></div><p id="status">待機中</p><small>ドラッグで視点変更、ピンチでズーム。遠景では外観、近景では室内を表示します。</small></div>
<div class="card"><b>シミュレーション結果</b><p id="result">地震を発生させてください。</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js/+esm';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';
const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);
const camera=new THREE.PerspectiveCamera(45,1,.1,120);camera.position.set(13,10,15);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.2,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=35;
scene.add(new THREE.HemisphereLight(0xe4edff,0x665544,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,15,8);scene.add(light);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
function box(parent,x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
const exterior=new THREE.Group(),interior=new THREE.Group(),yard=new THREE.Group();scene.add(exterior,interior,yard);
const plaster=mat(0xe1d6c4),wood=mat(0x986940),roof=mat(0x4e5660),tile=mat(0x68717a),glass=new THREE.MeshStandardMaterial({color:0x75cbea,roughness:.25}),blockMat=mat(0x999b9d);
box(scene,0,-.2,0,18,.3,18,mat(0x53694b));
// Floors and visible interior walls
box(interior,0,.02,0,8,.18,7,wood);box(interior,0,3.15,0,8,.18,7,wood);
box(interior,0,1.55,-3.45,8,3,.12,plaster);box(interior,-3.94,1.55,0,.12,3,7,plaster);box(interior,3.94,1.55,0,.12,3,7,plaster);
box(interior,0,4.65,-3.45,8,3,.12,plaster);box(interior,-3.94,4.65,0,.12,3,7,plaster);box(interior,3.94,4.65,0,.12,3,7,plaster);
box(interior,-2.6,1.55,3.45,2.8,3,.12,plaster);box(interior,2.6,1.55,3.45,2.8,3,.12,plaster);
// Outside walls and windows
box(exterior,0,1.55,-3.55,8,3,.16,plaster);box(exterior,-4,1.55,0,.16,3,7,plaster);box(exterior,4,1.55,0,.16,3,7,plaster);
box(exterior,0,4.65,-3.55,8,3,.16,plaster);box(exterior,-4,4.65,0,.16,3,7,plaster);box(exterior,4,4.65,0,.16,3,7,plaster);
for(const y of [1.6,4.7])for(const x of [-2.5,0,2.5])box(exterior,x,y,-3.65,1,.95,.04,glass);
// Two pitched roof planes, tiles
const r1=box(exterior,-2,6.1,0,4.7,.2,8,roof);r1.rotation.z=-.48;
const r2=box(exterior,2,6.1,0,4.7,.2,8,roof);r2.rotation.z=.48;
box(exterior,0,7.18,0,.25,.25,8.4,wood);
for(let s of [-1,1])for(let row=0;row<7;row++)for(let col=0;col<12;col++){const t=box(exterior,s*(.35+row*.48),7.05-row*.14,-3.6+col*.65,.46,.05,.57,tile);t.rotation.z=s===-1?-.48:.48;}
// yard path and fence visuals
box(yard,0,.02,7,15,.08,2,mat(0x85877d));
for(let i=0;i<12;i++)box(yard,-6+i*.95,.42,5.2,.88,.84,.38,blockMat);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;
const physMat=new CANNON.Material();world.addContactMaterial(new CANNON.ContactMaterial(physMat,physMat,{friction:.75,restitution:.01}));
world.addBody(new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(9,.15,9)),position:new CANNON.Vec3(0,-.2,0),material:physMat}));
const items=[];
function physical(name,x,y,z,w,h,d,color,mass,parent=interior){const mesh=box(parent,x,y,z,w,h,d,mat(color));const body=new CANNON.Body({mass,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z),material:physMat,linearDamping:.28,angularDamping:.5});world.addBody(body);const o={name,mesh,body,home:body.position.clone(),q:body.quaternion.clone(),mass};items.push(o);return o}
function shelf(x,z,name){const o=physical(name,x,1.12,z,1.15,2.15,.52,0x815638,18);for(const y of [.48,1,1.52]){box(o.mesh,0,y,.03,1.08,.05,.48,mat(0x64432c));for(let i=0;i<5;i++)box(o.mesh,-.43+i*.21,y+.16,.07,.13,.27,.25,mat([0x8b4b42,0x355d78,0xc29a54,0x52745a,0x6b5b86][i]));}return o}
shelf(-2.5,-1.7,'本棚A');shelf(2.4,-1.7,'本棚B');
physical('テレビ台',1.8,.52,1.2,1.5,.95,.6,0x5d718a,10);physical('テレビ',1.8,1.35,1.2,1.25,.72,.12,0x1d252d,2);
physical('テーブル',-1.5,.72,1.2,1.8,.14,.9,0x9c6339,0);
for(let i=0;i<4;i++)physical('小物',-2.05+i*.35,.9,1.2,.18,.22,.18,[0xe5bd59,0xd76e65,0x76b9e8,0x6b9c70][i],.3);
physical('ソファ',1.3,.48,2.5,2.1,.65,.9,0x526f83,22);
for(let i=0;i<12;i++)physical('ブロック塀',-6+i*.95,.42,5.2,.88,.84,.38,0x999b9d,9,yard);
// Add actual collision walls around room; wall bodies are fixed collision barriers.
for(const [x,y,z,w,h,d] of [[0,1.5,-3.5,8,3,.18],[-4,1.5,0,.18,3,7],[4,1.5,0,.18,3,7],[0,4.5,-3.5,8,3,.18],[-4,4.5,0,.18,3,7],[4,4.5,0,.18,3,7]])world.addBody(new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)}));
const names=['','1','2','3','4','5弱','5強','6弱','6強','7'],level=document.querySelector('#intensity'),duration=document.querySelector('#duration');
function settings(){document.querySelector('#iv').textContent=names[+level.value];document.querySelector('#dv').textContent=duration.value+' 秒'}level.oninput=settings;duration.oninput=settings;settings();
let running=false,elapsed=0,last=performance.now();
function shake(t){const n=+level.value,d=+duration.value;if(t>d)return{x:0,z:0};const a=[0,.0003,.0005,.0008,.0012,.002,.003,.0045,.006,.008][n],env=Math.min(1,t/.8)*Math.min(1,Math.max(0,(d-t)/2));return{x:a*env*(Math.sin(t*8)*.65+Math.sin(t*13.5+.7)*.25+Math.sin(t*21+1.8)*.1),z:a*.7*env*(Math.sin(t*5.5+.5)*.7+Math.sin(t*16+1.9)*.3)}}
function start(){running=true;elapsed=0;for(const o of items)if(o.mass>0)o.body.wakeUp();document.querySelector('#status').textContent='揺れています…';document.querySelector('#result').textContent='被害状況を計算中…'}
document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#status').textContent=running?'揺れています…':'一時停止中'};
document.querySelector('#reset').onclick=()=>{running=false;elapsed=0;for(const o of items){o.body.position.copy(o.home);o.body.quaternion.copy(o.q);o.body.velocity.setZero();o.body.angularVelocity.setZero();o.body.force.setZero();o.body.torque.setZero();o.body.wakeUp()}document.querySelector('#status').textContent='待機中';document.querySelector('#result').textContent='地震を発生させてください。'};
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(host);resize();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.025);last=now;
if(running){elapsed+=dt;const s=shake(elapsed),p=shake(Math.max(0,elapsed-dt)),n=shake(elapsed+dt);const ax=(n.x-2*s.x+p.x)/(dt*dt),az=(n.z-2*s.z+p.z)/(dt*dt);const fx=Math.max(-8,Math.min(8,-ax*1.2)),fz=Math.max(-8,Math.min(8,-az*1.2));
for(const o of items)if(o.mass>0){const lv=+level.value;if(o.name==='小物'&&lv>=4)o.body.wakeUp();if(o.name==='テレビ'&&lv>=7)o.body.wakeUp();if(o.name.startsWith('本棚')&&lv>=8)o.body.wakeUp();if(o.name==='ブロック塀'&&lv>=8)o.body.wakeUp();o.body.applyForce(new CANNON.Vec3(fx*o.mass,0,fz*o.mass),o.body.position)}
world.step(1/60,dt,3);if(elapsed>=+duration.value){running=false;const tipped=items.filter(o=>o.mass>0&&(o.body.position.y<o.home.y-.3||o.body.quaternion.vmult(new CANNON.Vec3(0,1,0)).y<.65)).length;document.querySelector('#status').textContent='揺れ終了';document.querySelector('#result').textContent=`移動・転倒した物体：${tipped} / ${items.filter(o=>o.mass>0).length}（簡易判定）`}}
const close=camera.position.distanceTo(controls.target)<10;exterior.visible=!close;interior.visible=true; // Near view cuts away the exterior shell and roof.
controls.update();renderer.render(scene,camera)}
requestAnimationFrame(animate);
</script></body></html>
